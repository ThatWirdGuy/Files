<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Player</title>
  <style>
    body {
      font-family: FreeMono, monospace;
      background: #3b3b3b;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  
    .top {
      background-color: #303030;
      width: 100vw;
      height: 75px;
      color: White;
      display: flex;
      align-items: center;
      padding-left: 20px;
      box-sizing: border-box;
    }

    .top h1 {
      margin: 0;
    }
    
    .undertop {
      background-color: #2d2d2d;
      width: 100vw;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    
    .fullscreen, .download, .back {
      background: #313131;
      border: 3px solid #393939;
      color: white;
      height: 30px;
      font-size: 17px;
      border-radius: 10px;
      transition: transform 0.15s ease, border 0.15s ease, background 0.15s ease;
    }

    .ogiab{
      background: #313131;
      border: 3px solid #393939;
      color: white;
      height: 60px;
      font-size: 30px;
      border-radius: 10px;
      display: block;
      margin: 20px auto;
    }
    
    .fullscreen { width: 110px; }
    .download { width: 110px; }
    .back { width: 100px; }
    .ogiab { width: 20vw; }
    .fullscreen:hover, .download:hover, .back:hover {
      transform: scale(1.1);
      border: 3px solid #424242;
      background: #424242;
      cursor: pointer;
    }
    
    .GameFrame {
      width: 80vw;
      height: 75vh;
      display: block;
      margin: 20px auto;
      border-radius: 20px;
      border: none;
      background: #1a1a1a;
    }
  </style>

    <link rel="icon" href="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main/Images/iconmain.png" type="image/x-icon">
</head>
<body>

  <div class="top">
    <h1 class="Name" id="gameTitle">Loading...</h1>
  </div>

  <div class="undertop">
    <button class="download" id="downloadBtn">Download</button>
    <button class="fullscreen" id="fullscreenBtn">Fullscreen</button>
    <button class="back" onclick="history.back()">Back</button>
  </div>

  <iframe class="GameFrame" id="gameFrame" allowfullscreen></iframe>

  <button class="ogiab">Open In about:blank</button>
  
<script>
  const CDN_BASE = "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main";
  const params = new URLSearchParams(window.location.search);
  
  const gameName = params.get("game");

  let fetchedHtml = "";

  function OpenInAboutBlank(code) {
  if (!code) {
    alert("There's no HTML code");
    return;
  }

  const newWindow = window.open("about:blank", "_blank");

  if (!newWindow) {
    alert("Popup blocked! Please allow popups for this site.");
    return;
  }

  newWindow.document.open();

  newWindow.document.write(`
    <html>
      <head>
        <title>Home - Google Drive</title>
        <link rel="icon" href="https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main/Images/drive.png">
      </head>
      <body>
        ${code}
      </body>
    </html>
  `);

  newWindow.document.close();
}
  
  if (gameName) {
      document.title = gameName;
      document.getElementById("gameTitle").textContent = gameName;
      const gameUrl = `${CDN_BASE}/g/${encodeURIComponent(gameName)}/Files/index.html`;

      fetch(gameUrl)
        .then(response => response.text())
        .then(htmlCode => {
            fetchedHtml = htmlCode;

            const frame = document.getElementById("gameFrame");
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            
            frameDoc.open();
            frameDoc.write(htmlCode);
            frameDoc.close();
        })
        .catch(err => {
            console.error("Error loading game code:", err);
            document.getElementById("gameFrame").src = gameUrl;
        });

      document.getElementById("downloadBtn").addEventListener("click", () => {
          const zipUrl = `${CDN_BASE}/g/${encodeURIComponent(gameName)}/Files/${encodeURIComponent(gameName)}.zip`;

          const a = document.createElement("a");
          a.href = zipUrl;
          a.download = `${gameName}.zip`;

          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
      });

  } else {
      document.getElementById("gameTitle").textContent = "No game selected";
  }

  document.getElementById("fullscreenBtn").addEventListener("click", () => {
      const frame = document.getElementById("gameFrame");

      if (frame.requestFullscreen) {
          frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
          frame.webkitRequestFullscreen();
      } else if (frame.mozRequestFullScreen) {
          frame.mozRequestFullScreen();
      }
  });

  document.querySelector(".ogiab").addEventListener("click", () => {
      OpenInAboutBlank(fetchedHtml);
  });
</script>
</body>
</html>
