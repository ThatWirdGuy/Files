<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU-46 - Flash</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #swf-container {
            width: 100vw;
            height: 100vh;
        }
        #swf-container ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script src="https://greys2121.github.io/RUFFFFFLE_EMBED/ruffle/ruffle.js"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden"
        };
    </script>
    <div id="swf-container"></div>
    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("swf-container");
            container.appendChild(player);
            player.style.width = "100%";
            player.style.height = "100vh";
            player.load("https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main/g/TU-46/Files/tu-46.swf");
        });
    </script>
</body>
</html>
