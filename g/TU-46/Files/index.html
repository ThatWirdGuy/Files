<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
    }
    #container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <p id="status" style="color:#aaa;font-size:14px;">Loading Ruffle...</p>
  </div>
  <script>
    window.addEventListener('load', () => {
      const ruffle = window.RufflePlayer.newest();
      const container = document.getElementById('container');
      const status = document.getElementById('status');
      const player = ruffle.createPlayer();
      player.style.width = '100%';
      player.style.height = '100%';
      container.replaceChild(player, status);
      player.load('https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main/g/TU-46/Files/tu-46.swf').catch(e => {
        container.innerHTML = '<p style="color:#f87171;font-size:14px;padding:1rem;">Failed to load SWF: ' + e.message + '</p>';
      });
    });
  </script>
</body>
</html>
