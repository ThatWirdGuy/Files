<!DOCTYPE html>
<html>
<style>
body {
  font-family: FreeMono, monospace;
  background: #3b3b3b;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.top {
  background-color: #303030;
  width: 100vw;
  height: 75px;
  color: white;
  display: flex;
  align-items: flex-start;
}

.undertop {
  background-color: #2d2d2d;
  width: 100vw;
  height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}

.games, .pat {
  background: none;
  border: none;
  color: white;
  height: 20px;
  font-size: 17px;
  cursor: pointer;
  transition: all 0.2s ease;
}
  
.gamesarea {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 20px;
}

.GameObject {
  background: #2b2b2b;
  width: 175px;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0 14px;
  gap: 12px;
  border: 2px solid #333333;
  transition: all 0.2s ease;
  text-decoration: none;
}

.GameObject h1 {
  color: white;
  font-size: 25px;
  font-family: FreeMono, monospace;
  margin: 0;
  text-align: center;
  padding: 0 8px;
}

.GameObject img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
}

.GameObject:hover {
  transform: scale(1.03);
  border: 2px solid #555555;
  cursor: pointer;
  background: #3a3a3a;
}
</style>

<head>
  <title>Activity Lab</title>
  <link rel="icon" href="/Images/favicon.ico" type="image/x-icon">
</head>

<body>
  <div class="top">
    <h1 class="Name">Activity Lab</h1>
  </div>

  <div class="undertop">
    
  </div>

  <div class="gamesarea" id="gamesArea"></div>

<script>
const API = "https://api.github.com/repos/ThatWirdGuy/Files/contents/g";
const CDN_BASE = "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main";
const GLOADER_URL = "https://thatwirdguy.github.io/Files/gloader.html";

function Underline_Buttons(clickedButton) {
  const currentActive = document.querySelector('.undertop .selected');
  if (currentActive) {
    currentActive.classList.remove('selected');
  }
  clickedButton.classList.add('selected');
}

async function loadGames() {
  const res = await fetch(API);
  const folders = await res.json();

  const games = [];

  for (const folder of folders) {
    if (folder.type !== "dir") continue;

    const gameName = folder.name;

    const imageUrl = `${CDN_BASE}/g/${gameName}/Image.png`;

    games.push({
      name: gameName,
      imageUrl
    });
  }

  return games;
}

loadGames().then(games => {
  const area = document.getElementById("gamesArea");

  games.forEach(game => {
    const card = document.createElement("a");
    card.className = "GameObject";
    card.href = `${GLOADER_URL}?game=${encodeURIComponent(game.name)}`;

    const title = document.createElement("h1");
    title.textContent = game.name;

    const img = document.createElement("img");
    img.src = game.imageUrl;

    card.appendChild(title);
    card.appendChild(img);
    area.appendChild(card);
  });
});
</script>
</body>
</html>
