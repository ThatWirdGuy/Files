<!DOCTYPE html>
<html>
  <style>
    body {
      font-family: FreeMono, monospace;
      background: #3b3b3b;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .top {
      background-color: #303030;
      width: 100vw;
      height: 75px;
      color: white;
      display: flex;
      align-items: flex-start;
    }
    .undertop {
      background-color: #2d2d2d;
      width: 100vw;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .games {
      background: none;
      border: none;
      color: white;
      width: 100px;
      height: 20px;
      font-size: 17px;
    }
    .pat {
      background: none;
      border: none;
      color: white;
      width: 200px;
      height: 20px;
      font-size: 17px;
    }
    .gamesarea {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px;
    }
    .GameObject {
      background: #2b2b2b;
      width: 175px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 14px;
      gap: 12px;
      border: 2px solid #333333;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .GameObject h1 {
      color: white;
      font-size: 25px;
      font-family: FreeMono, monospace;
      margin: 0;
      text-align: center;
      padding: 0 8px;
    }
    .GameObject img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    .GameObject:hover {
      transform: scale(1.03);
      border: 2px solid #555555;
      cursor: pointer;
      background: #3a3a3a;
    }
  </style>
  <head>
    <title>Activity Lab</title>
  </head>
  <body>
    <div class="top">
      <h1 class="Name">Activity Lab</h1>
    </div>
    <div class="undertop">
      <button class="games">Games</button>
      <button class="pat">Played All Time</button>
    </div>
    <div class="gamesarea" id="gamesArea"></div>
    <script>
      const JSDELIVR_API = "https://data.jsdelivr.com/v1/package/gh/ThatWirdGuy/Files@main/flat";
      const CDN_BASE     = "https://cdn.jsdelivr.net/gh/ThatWirdGuy/Files@main";
      const GLOADER_URL  = "https://thatwirdguy.github.io/Files/gloader.html";

      async function loadGames() {
        const res  = await fetch(JSDELIVR_API);
        const data = await res.json();
        console.log(data.files.map(f => f.name));
        const imagePaths = data.files
          .map(f => f.name)
          .filter(name => name.startsWith("/g/") && name.toLowerCase().endsWith("/Image.png"));
        return imagePaths.map(path => ({
          name:     path.split("/")[2],
          imageUrl: `${CDN_BASE}${path}`
        }));
      }

      loadGames().then(games => {
        const area = document.getElementById("gamesArea");
        games.forEach(game => {
          const card = document.createElement("a");
          card.className = "GameObject";
          card.href = `${GLOADER_URL}?game=${encodeURIComponent(game.name)}`;
          const title = document.createElement("h1");
          title.textContent = game.name;
          const img = document.createElement("img");
          img.src = game.imageUrl;
          img.alt = game.name;
          card.appendChild(title);
          card.appendChild(img);
          area.appendChild(card);
        });
      }).catch(err => console.error("Failed to load games:", err));
    </script>
  </body>
</html>
